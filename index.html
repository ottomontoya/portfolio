        <h2>6 Projects Across 6 Industries</h2>
        <article>
          <h3>Governed Data Access at Scale — Global Cybersecurity Platform</h3>
          <p>Industry: cybersecurity | Role: Data Analyst &amp; BI Specialist | Tools: Tableau, Snowflake, dbt | ~12 months | End-to-end</p>
          <p>Redesigned Tableau row-level security for a 1,500-user environment, consolidating 696 ad-hoc access paths into 12 maintainable access groups and retiring every identified PII-exposed data source.</p>
          <p>The Tableau environment had grown organically over years, leaving 696 ad-hoc access paths across ~1,500 active users, multiple data sources with PII exposure, and roughly 30 team-specific folders that made governance nearly impossible.</p>
          <p>Working from a usage and risk analysis of the site, I designed a new group-based Row Level Security model that collapsed 696 access paths into 12 access groups (3 default cases and 9 special cases) and retired 100% of the identified risky data sources. Every active user was migrated to the new model with no loss of legitimate access.</p>
          <p>Alongside the RLS redesign, I restructured ~30 team folders into 5 global, access-regulated folders, clearly separating Sandbox, Production, and Staging environments. I defined metrics for stale vs. active content and for inactive users and orphaned assets, then consolidated several manual review processes into a single admin monitoring dashboard, cutting ongoing admin workload by approximately 70%.</p>
          <p>Evidence: 696 → 12 — Access paths → groups.</p>
          <h4>Responsibilities</h4>
          <ul>
            <li>Designed a group-based RLS model collapsing 696 access paths into 12 access groups across ~1,500 users</li>
            <li>Migrated every active user to the new RLS model with no loss of legitimate access</li>
            <li>Retired 100% of identified PII-exposed data sources</li>
            <li>Restructured ~30 team folders into 5 global, access-regulated folders separating Sandbox, Production, and Staging</li>
            <li>Maintained the data catalog with dbt tagging and Snowflake metadata to support RLS enforcement</li>
            <li>Unified multiple manual admin review processes into a single Tableau monitoring dashboard for stale content, inactive users, and orphaned assets</li>
            <li>Authored governance documentation, admin demos, and user onboarding materials to roll the model out across all teams</li>
          </ul>
          <p>Impact: 696 ad-hoc access paths consolidated into 12 access groups across ~1,500 users. 100% of identified PII-exposed data sources removed. ~70% reduction in ongoing admin workload through process unification.</p>
          <p><a href="mailto:work@ottomontoya.com?subject=Project%20inquiry%20%E2%80%94%20Governed%20Data%20Access%20at%20Scale">Discuss a similar project</a></p>
        </article>

          <h3>Market Research Dashboards for a Global Automotive Manufacturer — Leading German Automotive Manufacturer</h3>
          <p>Industry: automotive | Role: BI Developer | Tools: Tableau | 6 mo | Implementation</p>
          <p>Built the Tableau visualization layer of a custom market research analytics platform, delivering ~15 dashboards from sketch-based designs that surface customer insights by market segment.</p>
          <p>The client, one of the largest globally recognized German automotive manufacturers, commissioned a custom market research analytics platform to uncover why specific customer segments prefer particular products and inform targeted marketing and production strategies. The platform combined automated data ingestion from sources like SPSS files, a research-oriented data warehouse supporting longitudinal analysis, and cross-tabulation tools for exploring behavioral patterns and trends. My work covered the visualization layer.</p>
          <p>I translated approximately 15 sketch-based designs into fully functional Tableau dashboards, working with datasets prepared by the data engineering team for each market research use case. Each dashboard went through iterative review cycles where I submitted completed work, the client provided feedback, and I refined until function and visuals matched both the original sketches and the client's expectations. The dashboards were then embedded into the client's internal portal as part of the platform's enterprise integration.</p>
          <p>In parallel, I conducted R&amp;D on Tableau Extensions to evaluate how third-party visual components could accelerate future development, offer richer chart types, and reduce reliance on complex calculated fields, simplifying both knowledge transfer and long-term maintenance.</p>
          <p>Evidence: ~15 — Dashboards delivered.</p>
          <h4>Responsibilities</h4>
          <ul>
            <li>Built the Tableau visualization layer for a custom market research analytics platform</li>
            <li>Translated ~15 sketch-based designs into production Tableau dashboards end-to-end</li>
            <li>Worked with datasets prepared by the data engineering team across multiple market research use cases</li>
            <li>Iterated through multiple client review cycles to align function and visuals with expectations</li>
            <li>Researched Tableau Extensions to expand visual options and simplify long-term maintenance</li>
            <li>Coordinated with the embedding team on technical constraints and integration readiness</li>
          </ul>
          <p>Impact: Delivered the full dashboard suite for the platform, live and embedded in the client's internal portal, enabling cross-tabulation and longitudinal analysis of customer behavior to support targeted marketing and production decisions.</p>
          <p>Case study: <a href="https://www.stxnext.com/case-study/market-research-platform">https://www.stxnext.com/case-study/market-research-platform</a></p>

          <h3>BI Layer for an Open Source Foundation's Salesforce Migration — Major Open Source Software Foundation</h3>
          <p>Industry: non-profit | Role: BI Consultant | Tools: Amazon QuickSight, Snowflake | 3 mo | End-to-end</p>
          <p>Designed and built three QuickSight dashboards on a Snowflake-backed data layer covering CRM, web analytics, and GitHub community activity, all redesigned from scratch as part of the client's move off Salesforce reporting.</p>
          <p>The client, a major open source software foundation, was rebuilding their analytics and reporting away from Salesforce to gain full ownership of their data and reduce platform dependency. The data engineering team migrated source systems into Snowflake, and I was brought in to build the QuickSight dashboard layer that surfaced that data back to the business.</p>
          <p>Working from high-level requirements rather than detailed mockups, I designed and iterated on dashboard concepts, presented them in weekly client reviews, and translated feedback into three production QuickSight dashboards covering Salesforce CRM, web analytics, and GitHub community activity. All three were designed from scratch. For the CRM and web analytics views, existing reports served as reference material for understanding which KPIs the team tracked, but the visualizations, structure, and chart choices were my own design, switched out to be clearer and more concise. The GitHub dashboard had no reference to anchor against and was designed end-to-end from client requirements alone.</p>
          <p>I authored a detailed specification document for the data engineering team, outlining required fields, grain, and source systems for each dashboard so the upstream Snowflake models delivered exactly what reporting needed. After implementation I ran data validation and iterative refinement to ensure metrics matched source-system expectations before handoff.</p>
          <p>Evidence: 3 → 1 — Sources unified: CRM, Web analytics, GitHub community activity into Controlled BI environment.</p>

            <li>Designed a net-new GitHub community activity dashboard end-to-end from client requirements with no prior dashboard to reference</li>
            <li>Authored data specification documents for the data engineering team to align upstream Snowflake models with reporting needs</li>
            <li>Performed data validation against source systems to confirm metric accuracy before handoff</li>
          </ul>
          <p>Impact: Three data sources unified in a single controlled BI environment, giving the client's team a consolidated view of funnel, web, and community performance independent of Salesforce reporting.</p>

          <h3>Real-Time Manufacturing Analytics for a Global Heavy Industry Manufacturer — Global Heavy Industry Manufacturer</h3>
          <p>Industry: manufacturing | Role: BI Developer | Tools: Amazon QuickSight | 3 wk | Implementation</p>
          <p>Implemented a four-view real-time manufacturing analytics suite natively in AWS QuickSight from production design mockups, covering furnace process monitoring and a 2,000+ asset rotating equipment fleet.</p>
          <p>The client, a global manufacturer running highly complex industrial operations, needed a real-time monitoring tool built ground-up to replace standard BI templates that struggled to prioritize critical signals across millions of raw sensor readings. The production design team partnered with subject matter experts to translate physical plant infrastructure into an intuitive digital ecosystem grounded in cognitive UI principles, and I owned the implementation of that design in AWS QuickSight.</p>
          <p>I built the full interactive dashboard layer across four interconnected views: a Furnace Process Overview surfacing high-level situational awareness for safety calls, a Detailed Metrics view exposing point diagnostics without visual clutter, a Rotating Equipment Fleet view monitoring 2,000+ assets with intelligent status prioritization, and an Asset Deep Dive that walks operators through a clear diagnostic narrative tied to direct work order actions.</p>
          <p>My implementation work covered visual formatting and layout, conditional formatting tied to operational thresholds, interactive filtering, cross-view drill-down navigation, and every other in-dashboard behavior end users interact with. The result was a fully native QuickSight build that preserved the design system's nuance while handling production-scale fleet data.</p>
          <p>Evidence: 2,000+ — Assets monitored.</p>

            <li>Translated the design system's cognitive UI principles into native QuickSight components within the tool's constraints</li>
            <li>Iterated alongside the design team to preserve visual nuance and intent through implementation</li>
          </ul>
          <p>Impact: Delivered a fully native Amazon QuickSight dashboard suite implementing the cognitive UI design system at production scale, giving operators real-time visibility into furnace process health and a 2,000+ asset rotating equipment fleet.</p>
